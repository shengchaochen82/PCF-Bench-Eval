[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pcfbench"
version = "0.0.0"
description = "Evaluation suite for PCFBench, a benchmark for vision-language models in photonic crystal fibre inverse design (NeurIPS 2026 Evaluations & Datasets Track)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Shengchao Chen" },
    { name = "Ting Shu" },
    { name = "Sufen Ren" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "openai>=1.40",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "tqdm>=4.66",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "numpy>=1.24",
    "requests>=2.31",
    "datasets>=3.0",
    "Pillow>=10.0",
]

[project.urls]
Homepage = "https://pcfbench.github.io/"
Repository = "https://github.com/shengchaochen82/PCF-Bench-Eval"
Dataset = "https://huggingface.co/datasets/PCF-Bench/PCF-Bench"

[project.optional-dependencies]
mas = [
    "scipy",
    "Pillow",
]

[project.scripts]
pcfbench = "pcfbench.cli:main"

[tool.setuptools]
packages = ["pcfbench"]

[tool.setuptools.package-data]
pcfbench = ["*.yaml", "*.json"]
