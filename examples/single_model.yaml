# Single-model evaluation across all tasks (default leaderboard run).
run_name: gpt-4o-mini-baseline

# Parquet input: a HuggingFace repo id, OR a local glob over parquet shards.
dataset: PCF-Bench/PCF-Bench
# dataset: /path/to/PCF-Bench-HF/data/full-*.parquet

# Optional. If unset, defaults to '<output_dir>/.cache/<slug>'.
# cache_dir: /scratch/pcfbench-cache

output_dir: results

provider:
  name: yunwu
  timeout_s: 120
  max_retries: 3

model: gpt-4o-mini

# Use one or more env-var names holding API keys (auto round-robin).
api_keys_env:
  - YUNWU_API_KEY_1
  - YUNWU_API_KEY_2

tasks: all          # or e.g. [family_classification, loss_prediction_1550]
max_samples: 200    # ignored if subset_manifest is set
# subset_manifest: examples/subset_v1.json

runner:
  num_workers: 16
  rpm_limit: 600
  temperature: 0.1
  max_tokens: 2048
